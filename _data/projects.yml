- title: (OG) MILKRUN
  description: >-
    MILKRUN was a delivery service app which allowed users to order groceries (and more!) for home delivery. The company attracted
    one of the largest Australian series A investments before being acquired by Woolworths. I joined the original core app team
    and developed the MILKRUN Flutter app, working cross-functionally with the backend team.
  tags:
    - Flutter
    - Firebase
    - TypeScript
    - Node.js
    - PostgreSQL
    - Shopify

