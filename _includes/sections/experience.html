<section id="experience">
    <div class="container">
        <span class="section-label">Career</span>
        <h2>Experience</h2>
        <div class="experience-list">
            {%- for job in site.data.experience -%}
            <div class="experience-item">
                <div class="experience-date">{{ job.dates }}</div>
                <h3>{{ job.role }}</h3>
                <div class="experience-company">{{ job.company }}</div>
                {%- if job.bullets -%}
                <ul>
                    {%- for bullet in job.bullets -%}
                    <li>{{ bullet }}</li>
                    {%- endfor -%}
                </ul>
                {%- endif -%}
            </div>
            {%- endfor -%}
        </div>
    </div>
</section>
