<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ site.author.name }}{% if page.title %} &mdash; {{ page.title }}{% endif %}</title>
    <meta name="description" content="{{ site.description | strip_html | truncatewords: 30 }}">

    <!-- Open Graph -->
    <meta property="og:title" content="{{ site.author.name }}">
    <meta property="og:description" content="{{ site.description | strip_html | truncatewords: 30 }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ site.url }}{{ site.baseurl }}">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap"
        rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
